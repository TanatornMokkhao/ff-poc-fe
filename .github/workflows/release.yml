name: Release

# The hub tags this repo; one tag releases the web app and the mobile apps.
#   staging/vX.Y.Z-rc.N  bake config.json for staging and for prod (from this repo's staging and
#                        production environment variables) and build the web for each at once;
#                        the hub deploys the staging web without waiting for the apps.
#                        The apps (staging and prod variants) are built only after a person approves
#                        app-test, then go to the testers. A later rc on the same commit reuses
#                        whatever was built.
#   prod/vX.Y.Z          only on a commit with a staging/vX.Y.Z-rc.N tag; reuse that rc's prod web.
#                        The apps wait for an approval on app-store: the rc's prod builds are reused,
#                        or built then if the rc's apps were never approved. Store release simulated.
on:
  push:
    tags: ['staging/v*', 'prod/v*']

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      stage: ${{ steps.v.outputs.stage }}
      from: ${{ steps.v.outputs.from }}
      build: ${{ steps.v.outputs.stage == 'staging' && steps.v.outputs.from == '' }}
      mobile_stages: ${{ steps.v.outputs.mobile_stages }}
      config_stages: ${{ steps.v.outputs.config_stages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The hub tags this repo; people do not tag here.
      - name: Read the tag and find earlier builds of this commit
        id: v
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^staging/v([0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+)$ ]]; then
            STAGE=staging; VERSION="${BASH_REMATCH[1]}"
          elif [[ "$GITHUB_REF_NAME" =~ ^prod/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            STAGE=prod; VERSION="${BASH_REMATCH[1]}"
          else
            echo "Tag $GITHUB_REF_NAME must be staging/vX.Y.Z-rc.N or prod/vX.Y.Z"; exit 1
          fi
          PREV=$(git tag --points-at "$GITHUB_SHA" | grep -E '^staging/v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' | grep -vx "$GITHUB_REF_NAME" | sort -V | tail -1 || true)
          if [ "$STAGE" = prod ]; then
            PREV=$(git tag --points-at "$GITHUB_SHA" | grep -E "^staging/v$VERSION-rc\.[0-9]+$" | sort -V | tail -1 || true)
            [ -n "$PREV" ] || { echo "No staging/v$VERSION-rc.N on this commit: it never went to staging."; exit 1; }
          fi
          # Apps already built for this commit? Then reuse them; otherwise build after the approval.
          has() { [ -n "$PREV" ] && gh release view "$PREV" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$1"; }
          if [ "$STAGE" = prod ]; then
            if has android-prod-app-release.aab; then MOBILE='[]'; else MOBILE='["prod"]'; fi
          else
            if has android-staging-app-release.apk; then MOBILE='[]'; else MOBILE='["staging","prod"]'; fi
          fi
          if [ "$STAGE" = staging ] && [ -z "$PREV" ]; then CONFIG='["staging","prod"]'; else CONFIG="$MOBILE"; fi
          {
            echo "stage=$STAGE"; echo "version=$VERSION"; echo "from=$PREV"
            echo "mobile_stages=$MOBILE"; echo "config_stages=$CONFIG"
          } >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME: web ${PREV:+reuses $PREV}${PREV:-builds new}; apps to build after approval: $MOBILE"

  # One config.json per stage, from that environment's variables. Web and apps bake the same file.
  config:
    needs: meta
    if: ${{ needs.meta.outputs.config_stages != '[]' }}
    strategy:
      matrix:
        stage: ${{ fromJSON(needs.meta.outputs.config_stages) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.stage == 'prod' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Bake config.json
        env:
          STAGE: ${{ matrix.stage }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: node scripts/write-config.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: config-${{ matrix.stage }}
          path: public/config.json

  web:
    needs: [meta, config]
    if: ${{ needs.meta.outputs.build == 'true' }}
    strategy:
      matrix:
        stage: [staging, prod]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - uses: actions/download-artifact@v4
        with:
          name: config-${{ matrix.stage }}
          path: public
      - name: Build the web for ${{ matrix.stage }}
        env:
          VITE_APP_VERSION: ${{ needs.meta.outputs.version }}
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_API_ENV: ${{ matrix.stage }}
        run: |
          npm run build
          # What this build is, written by the build itself; the hub checks it against the pin.
          printf '{"app":"fe","version":"%s","commit":"%s","stage":"%s","builtAt":"%s"}\n' \
            "$VITE_APP_VERSION" "$VITE_GIT_SHA" "$VITE_API_ENV" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build-info.json
          (cd dist && zip -qr "$GITHUB_WORKSPACE/web-build-${{ matrix.stage }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.stage }}
          path: web-build-${{ matrix.stage }}.zip

  # Puts the web builds on this tag's release (new for a first rc, an earlier rc's otherwise); the
  # hub waits for web-build-<stage>.zip, so staging deploys without waiting for the apps.
  publish-web:
    needs: [meta, web]
    if: ${{ !cancelled() && needs.meta.result == 'success' && (needs.meta.outputs.build != 'true' || needs.web.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STAGE: ${{ needs.meta.outputs.stage }}
      FROM: ${{ needs.meta.outputs.from }}
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ needs.meta.outputs.build == 'true' }}
        with:
          pattern: web-*
          path: builds
          merge-multiple: true
      - name: Collect the web builds
        run: |
          set -euo pipefail
          mkdir upload
          if [ -n "$FROM" ]; then gh release download "$FROM" -D upload -p 'web-build-*'
          else cp builds/web-build-*.zip upload/; fi
          [ "$STAGE" = prod ] && find upload -type f ! -name '*prod*' -delete
          [ -f "upload/web-build-$STAGE.zip" ] || { echo "::error::No web-build-$STAGE.zip in ${FROM:-this build}. An rc made before per-stage builds cannot be reused: release a new rc."; exit 1; }
          ls -la upload
      - name: GitHub release (reuse the one made in the UI, if any)
        run: |
          FLAG=$([ "$STAGE" = staging ] && echo --prerelease || echo --latest)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" $FLAG
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes $FLAG
          fi
          gh release upload "$GITHUB_REF_NAME" upload/* --clobber

  # Nothing is built or sent for the apps until a person approves: app-test for an rc, app-store
  # for prod. Leaving it unapproved costs no build minutes.
  mobile-approval:
    needs: [meta, publish-web]
    if: ${{ !cancelled() && needs.publish-web.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.meta.outputs.stage == 'prod' && 'app-store' || 'app-test' }}
    steps:
      - name: Store credentials (prod only, from the app-store environment)
        if: ${{ needs.meta.outputs.stage == 'prod' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON is missing in the app-store environment."; exit 1; }
          [ -n "$APP_STORE_CONNECT_API_KEY" ] || { echo "::error::APP_STORE_CONNECT_API_KEY is missing in the app-store environment."; exit 1; }
          echo "Play project: $(jq -r '.project_id // "not set"' <<<"$PLAY_SERVICE_ACCOUNT_JSON" 2>/dev/null || echo 'not JSON')"
      - run: 'echo "Approved. Apps to build: ${{ needs.meta.outputs.mobile_stages }} (empty = reuse the rc builds)."'

  android:
    needs: [meta, config, mobile-approval]
    if: ${{ !cancelled() && needs.mobile-approval.result == 'success' && needs.meta.outputs.mobile_stages != '[]' }}
    strategy:
      matrix:
        stage: ${{ fromJSON(needs.meta.outputs.mobile_stages) }}
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      version_name: ${{ needs.meta.outputs.version }}
      stage: ${{ matrix.stage }}

  ios:
    needs: [meta, config, mobile-approval]
    if: ${{ !cancelled() && needs.mobile-approval.result == 'success' && needs.meta.outputs.mobile_stages != '[]' }}
    strategy:
      matrix:
        stage: ${{ fromJSON(needs.meta.outputs.mobile_stages) }}
    uses: ./.github/workflows/ios.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      version_name: ${{ needs.meta.outputs.version }}
      stage: ${{ matrix.stage }}

  # Attaches the app builds (new, or the rc's) and sends them: staging to the testers, prod to the
  # stores (simulated).
  mobile-release:
    needs: [meta, mobile-approval, android, ios]
    if: ${{ !cancelled() && needs.mobile-approval.result == 'success' && (needs.meta.outputs.mobile_stages == '[]' || (needs.android.result == 'success' && needs.ios.result == 'success')) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STAGE: ${{ needs.meta.outputs.stage }}
      VERSION: ${{ needs.meta.outputs.version }}
      FROM: ${{ needs.meta.outputs.from }}
      BUILT: ${{ join(fromJSON(needs.meta.outputs.mobile_stages), ' ') }}
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ needs.meta.outputs.mobile_stages != '[]' }}
        with:
          pattern: android-release-*
          path: builds
      - uses: actions/download-artifact@v4
        if: ${{ needs.meta.outputs.mobile_stages != '[]' }}
        with:
          pattern: ios-simulator-app-*
          path: builds
      - name: Collect the app builds
        run: |
          set -euo pipefail
          mkdir upload
          if [ -z "$BUILT" ]; then
            gh release download "$FROM" -D upload -p 'android-*' -p 'ios-*'
            [ "$STAGE" = prod ] && find upload -type f ! -name '*prod*' -delete
          fi
          for s in $BUILT; do
            find "builds/android-release-$VERSION-$s" -name '*.aab' -exec cp {} "upload/android-$s-app-release.aab" \;
            find "builds/android-release-$VERSION-$s" -name '*.apk' -exec cp {} "upload/android-$s-app-release.apk" \;
            cp "builds/ios-simulator-app-$VERSION-$s/App-simulator.zip" "upload/ios-$s-App-simulator.zip"
          done
          ls -la upload
          gh release upload "$GITHUB_REF_NAME" upload/* --clobber

      # Real, not simulated: the staging app goes to the testers through Firebase App Distribution.
      - name: Send the staging Android app to testers
        if: ${{ needs.meta.outputs.stage == 'staging' && vars.FIREBASE_APP_ID_ANDROID_STAGING != '' }}
        env:
          SA_JSON: ${{ secrets.FIREBASE_DISTRIBUTION_SA_JSON }}
          APP_ID: ${{ vars.FIREBASE_APP_ID_ANDROID_STAGING }}
          GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'staging-testers' }}
        run: |
          set -euo pipefail
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@15.32.1 \
            appdistribution:distribute upload/android-staging-app-release.apk \
            --app "$APP_ID" --groups "$GROUPS" --release-notes "staging $VERSION"
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Summary
        run: |
          HOW=$([ -n "$BUILT" ] && echo "built after the approval" || echo "the builds of **$FROM**, no rebuild")
          if [ "$STAGE" = staging ]; then
            SENT=$([ -n "${{ vars.FIREBASE_APP_ID_ANDROID_STAGING }}" ] && echo "sent to **Firebase App Distribution**" || echo "not sent: set FIREBASE_APP_ID_ANDROID_STAGING")
            {
              echo "### App $VERSION on the test channels ($HOW)"
              echo "| App | Android | iOS |"
              echo "| --- | --- | --- |"
              echo "| staging (testers, staging API) | \`android-staging-app-release.apk\` $SENT | \`ios-staging-App-simulator.zip\` (simulated) |"
              echo "| prod (the build the stores get) | \`android-prod-app-release.aab\` to Play **internal** (simulated) | \`ios-prod-App-simulator.zip\` to **TestFlight** (simulated) |"
              echo
              echo "A signed IPA needs an Apple account; the iOS files are Simulator builds."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### App $VERSION released to the stores (simulated, $HOW)"
              echo "| Platform | Would run |"
              echo "| --- | --- |"
              echo "| Android | promote \`android-prod-app-release.aab\` from internal to **production** (staged rollout 10%) |"
              echo "| iOS | submit the prod build for **App Store review**, release by hand after approval |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
