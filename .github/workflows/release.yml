name: Release

# One tag releases the web app and the mobile app together; they share this code and version.
# Tags are made by a person in GitHub Releases (or git push):
#   staging/v1.2.0, staging/v1.2.0-2 …  build the web once (attached to the release), build the
#                apps for the test channels, and point hub staging at this version.
#   prod/v1.2.0  only on a commit that already has a staging/v1.2.0 tag; reuse that staging
#                build (no rebuild) and open a PR in the hub to point production at it.
on:
  push:
    tags: ['staging/v*', 'prod/v*']

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      stage: ${{ steps.v.outputs.stage }}
      staging_tag: ${{ steps.stg.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the tag
        id: v
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^staging/v([0-9]+\.[0-9]+\.[0-9]+)(-([0-9]+))?$ ]]; then
            STAGE=staging; BASE="${BASH_REMATCH[1]}"; VERSION="${GITHUB_REF_NAME#staging/v}"
          elif [[ "$GITHUB_REF_NAME" =~ ^prod/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            STAGE=prod; BASE="${BASH_REMATCH[1]}"; VERSION="$BASE"
          else
            echo "Tag $GITHUB_REF_NAME must be staging/vX.Y.Z, staging/vX.Y.Z-N or prod/vX.Y.Z"; exit 1
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Production must come from staging (same version, same commit)
        if: ${{ steps.v.outputs.stage == 'prod' }}
        id: stg
        run: |
          STG=$(git tag --points-at "$GITHUB_SHA" | grep -E "^staging/v${{ steps.v.outputs.base }}(-[0-9]+)?$" | sort -V | tail -1)
          [ -n "$STG" ] || { echo "No staging/v${{ steps.v.outputs.base }} tag on this commit: it never went to staging."; exit 1; }
          echo "tag=$STG" >> "$GITHUB_OUTPUT"
          echo "Promoting the build made for $STG"

      - uses: actions/setup-node@v4
        if: ${{ steps.v.outputs.stage == 'staging' }}
        with:
          node-version: 22
          cache: npm

      - name: Build the web once (staging)
        if: ${{ steps.v.outputs.stage == 'staging' }}
        run: |
          npm ci
          npx vitest run
          VITE_APP_VERSION="${{ steps.v.outputs.version }}" npm run build
          rm -f dist/config.json
          (cd dist && zip -qr "$GITHUB_WORKSPACE/web-build.zip" .)

      - name: Reuse the staging web build (prod)
        if: ${{ steps.v.outputs.stage == 'prod' }}
        run: gh release download "${{ steps.stg.outputs.tag }}" -p web-build.zip

      - name: GitHub release (reuse the one made in the UI, if any)
        run: |
          FLAG=$([ "${{ steps.v.outputs.stage }}" = staging ] && echo --prerelease || echo --latest)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" $FLAG
            gh release upload "$GITHUB_REF_NAME" web-build.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" web-build.zip --generate-notes $FLAG
          fi

  android:
    needs: web
    if: ${{ needs.web.outputs.stage == 'staging' }}
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      version_name: ${{ needs.web.outputs.version }}
      api_env: staging

  ios:
    needs: web
    if: ${{ needs.web.outputs.stage == 'staging' }}
    uses: ./.github/workflows/ios.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      version_name: ${{ needs.web.outputs.version }}
      api_env: staging

  # Simulated: keeps the staging app builds on the staging release and says where they would go.
  mobile-test-channels:
    needs: [web, android, ios]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.web.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: builds
      - name: Attach the app builds to the staging release
        run: |
          mkdir -p upload
          find builds -name '*.aab' -exec cp {} upload/android-app-release.aab \; || true
          find builds -path '*release*' -name '*.apk' -exec cp {} upload/android-app-release.apk \; || true
          find builds -name 'App-simulator.zip' -exec cp {} upload/ios-App-simulator.zip \; || true
          ls -la upload
          gh release upload "$GITHUB_REF_NAME" upload/* --clobber
      - name: Simulated upload to test channels
        run: |
          {
            echo "### App $VERSION sent to test channels (simulated)"
            echo "| Platform | Would run | Build |"
            echo "| --- | --- | --- |"
            echo "| Android | upload to Play **internal** track | \`android-app-release.aab\` |"
            echo "| iOS | upload to **TestFlight** internal testers | \`ios-App-simulator.zip\` (a signed IPA needs an Apple account) |"
            echo ""
            echo "Builds are attached to release $GITHUB_REF_NAME."
          } >> "$GITHUB_STEP_SUMMARY"

  # Simulated: the prod tag promotes the staging app builds to the stores. A person approves first.
  mobile-store:
    needs: web
    if: ${{ needs.web.outputs.stage == 'prod' }}
    runs-on: ubuntu-latest
    environment: app-store
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.web.outputs.version }}
      STG: ${{ needs.web.outputs.staging_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Take the builds from the staging release
        run: |
          mkdir builds && gh release download "$STG" -D builds -p 'android-*' -p 'ios-*'
          ls -la builds
          gh release upload "$GITHUB_REF_NAME" builds/* --clobber
      - name: Simulated store release
        run: |
          {
            echo "### App $VERSION released to the stores (simulated)"
            echo "Same builds as **$STG**, no rebuild."
            echo "| Platform | Would run |"
            echo "| --- | --- |"
            echo "| Android | promote the $STG build from internal to **production** (staged rollout 10%) |"
            echo "| iOS | submit the $STG TestFlight build for **App Store review**, release by hand after approval |"
          } >> "$GITHUB_STEP_SUMMARY"

  hub:
    needs: web
    uses: TanatornMokkhao/ff-poc-hub/.github/workflows/promote.yml@main
    with:
      app: fe,mobile
      version: ${{ needs.web.outputs.version }}
      stage: ${{ needs.web.outputs.stage }}
    secrets:
      DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
