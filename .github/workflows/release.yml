name: Release

# The hub tags this repo; one tag releases the web app and the mobile app together.
#   staging/vX.Y.Z-rc.N  build the web (attached to the release) and the apps for the test
#                        channels; a later rc on the same commit reuses those builds.
#   prod/vX.Y.Z          only on a commit with a staging/vX.Y.Z-rc.N tag; reuse that rc's
#                        builds (no rebuild) and release the apps to the stores (simulated).
on:
  push:
    tags: ['staging/v*', 'prod/v*']

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      stage: ${{ steps.v.outputs.stage }}
      from: ${{ steps.v.outputs.from }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The hub tags this repo; people do not tag here.
      - name: Read the tag and find an earlier build of this commit
        id: v
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^staging/v([0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+)$ ]]; then
            STAGE=staging; VERSION="${BASH_REMATCH[1]}"
          elif [[ "$GITHUB_REF_NAME" =~ ^prod/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            STAGE=prod; VERSION="${BASH_REMATCH[1]}"
          else
            echo "Tag $GITHUB_REF_NAME must be staging/vX.Y.Z-rc.N or prod/vX.Y.Z"; exit 1
          fi
          PREV=$(git tag --points-at "$GITHUB_SHA" | grep -E '^staging/v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' | grep -vx "$GITHUB_REF_NAME" | sort -V | tail -1 || true)
          if [ "$STAGE" = prod ]; then
            PREV=$(git tag --points-at "$GITHUB_SHA" | grep -E "^staging/v$VERSION-rc\.[0-9]+$" | sort -V | tail -1 || true)
            [ -n "$PREV" ] || { echo "No staging/v$VERSION-rc.N on this commit: it never went to staging."; exit 1; }
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "from=$PREV" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME: ${PREV:+reuse the build of $PREV}${PREV:-build new}"

      - uses: actions/setup-node@v4
        if: ${{ steps.v.outputs.from == '' }}
        with:
          node-version: 22
          cache: npm

      - name: Build the web once (first rc of this commit)
        if: ${{ steps.v.outputs.from == '' }}
        run: |
          npm ci
          npx vitest run
          VITE_APP_VERSION="${{ steps.v.outputs.version }}" npm run build
          rm -f dist/config.json
          (cd dist && zip -qr "$GITHUB_WORKSPACE/web-build.zip" .)

      - name: Reuse the build already made for this commit
        if: ${{ steps.v.outputs.from != '' }}
        run: gh release download "${{ steps.v.outputs.from }}" -p web-build.zip

      - name: GitHub release (reuse the one made in the UI, if any)
        run: |
          FLAG=$([ "${{ steps.v.outputs.stage }}" = staging ] && echo --prerelease || echo --latest)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" $FLAG
            gh release upload "$GITHUB_REF_NAME" web-build.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" web-build.zip --generate-notes $FLAG
          fi

  # Apps are built only for the first rc of a commit; a later rc of the same commit reuses them.
  android:
    needs: web
    if: ${{ needs.web.outputs.stage == 'staging' && needs.web.outputs.from == '' }}
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      version_name: ${{ needs.web.outputs.version }}
      api_env: staging

  ios:
    needs: web
    if: ${{ needs.web.outputs.stage == 'staging' && needs.web.outputs.from == '' }}
    uses: ./.github/workflows/ios.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      version_name: ${{ needs.web.outputs.version }}
      api_env: staging

  # Simulated: puts the app builds on the staging release and says where they would go.
  mobile-test-channels:
    needs: [web, android, ios]
    if: ${{ !cancelled() && needs.web.outputs.stage == 'staging' && (needs.web.outputs.from != '' || (needs.android.result == 'success' && needs.ios.result == 'success')) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.web.outputs.version }}
      FROM: ${{ needs.web.outputs.from }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ needs.web.outputs.from == '' }}
        with:
          path: builds
      - name: Attach the app builds to the staging release
        run: |
          mkdir -p upload
          if [ -n "$FROM" ]; then
            gh release download "$FROM" -D upload -p 'android-*' -p 'ios-*'
          else
            find builds -name '*.aab' -exec cp {} upload/android-app-release.aab \; || true
            find builds -path '*release*' -name '*.apk' -exec cp {} upload/android-app-release.apk \; || true
            find builds -name 'App-simulator.zip' -exec cp {} upload/ios-App-simulator.zip \; || true
          fi
          ls -la upload
          gh release upload "$GITHUB_REF_NAME" upload/* --clobber
      - name: Simulated upload to test channels
        run: |
          {
            echo "### App $VERSION sent to test channels (simulated)"
            [ -n "$FROM" ] && echo "Same builds as **$FROM** (this commit was built for that rc)."
            echo "| Platform | Would run | Build |"
            echo "| --- | --- | --- |"
            echo "| Android | upload to Play **internal** track | \`android-app-release.aab\` |"
            echo "| iOS | upload to **TestFlight** internal testers | \`ios-App-simulator.zip\` (a signed IPA needs an Apple account) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Simulated: the prod tag promotes the rc's app builds to the stores. A person approves first.
  mobile-store:
    needs: web
    if: ${{ needs.web.outputs.stage == 'prod' }}
    runs-on: ubuntu-latest
    environment: app-store
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.web.outputs.version }}
      STG: ${{ needs.web.outputs.from }}
    steps:
      - uses: actions/checkout@v4
      - name: Take the builds from the rc release
        run: |
          mkdir builds && gh release download "$STG" -D builds -p 'android-*' -p 'ios-*'
          ls -la builds
          gh release upload "$GITHUB_REF_NAME" builds/* --clobber
      - name: Simulated store release
        run: |
          {
            echo "### App $VERSION released to the stores (simulated)"
            echo "Same builds as **$STG**, no rebuild."
            echo "| Platform | Would run |"
            echo "| --- | --- |"
            echo "| Android | promote the $STG build from internal to **production** (staged rollout 10%) |"
            echo "| iOS | submit the $STG TestFlight build for **App Store review**, release by hand after approval |"
          } >> "$GITHUB_STEP_SUMMARY"
