name: Release

# The hub tags this repo; one tag releases the web app and the mobile apps together.
#   staging/vX.Y.Z-rc.N  bake config.json for staging and for prod (from this repo's staging and
#                        production environment variables), then build web and apps once for each;
#                        a later rc on the same commit reuses those builds.
#   prod/vX.Y.Z          only on a commit with a staging/vX.Y.Z-rc.N tag; reuse that rc's prod
#                        builds (no rebuild) and release the apps to the stores (simulated).
on:
  push:
    tags: ['staging/v*', 'prod/v*']

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      stage: ${{ steps.v.outputs.stage }}
      from: ${{ steps.v.outputs.from }}
      build: ${{ steps.v.outputs.stage == 'staging' && steps.v.outputs.from == '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The hub tags this repo; people do not tag here.
      - name: Read the tag and find an earlier build of this commit
        id: v
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^staging/v([0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+)$ ]]; then
            STAGE=staging; VERSION="${BASH_REMATCH[1]}"
          elif [[ "$GITHUB_REF_NAME" =~ ^prod/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            STAGE=prod; VERSION="${BASH_REMATCH[1]}"
          else
            echo "Tag $GITHUB_REF_NAME must be staging/vX.Y.Z-rc.N or prod/vX.Y.Z"; exit 1
          fi
          PREV=$(git tag --points-at "$GITHUB_SHA" | grep -E '^staging/v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' | grep -vx "$GITHUB_REF_NAME" | sort -V | tail -1 || true)
          if [ "$STAGE" = prod ]; then
            PREV=$(git tag --points-at "$GITHUB_SHA" | grep -E "^staging/v$VERSION-rc\.[0-9]+$" | sort -V | tail -1 || true)
            [ -n "$PREV" ] || { echo "No staging/v$VERSION-rc.N on this commit: it never went to staging."; exit 1; }
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "from=$PREV" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME: ${PREV:+reuse the builds of $PREV}${PREV:-build new}"

  # One config.json per stage, from that environment's variables. Web and apps bake the same file.
  config:
    needs: meta
    if: ${{ needs.meta.outputs.build == 'true' }}
    strategy:
      matrix:
        stage: [staging, prod]
    runs-on: ubuntu-latest
    environment: ${{ matrix.stage == 'prod' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Bake config.json
        env:
          STAGE: ${{ matrix.stage }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: node scripts/write-config.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: config-${{ matrix.stage }}
          path: public/config.json

  web:
    needs: [meta, config]
    if: ${{ needs.meta.outputs.build == 'true' }}
    strategy:
      matrix:
        stage: [staging, prod]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - uses: actions/download-artifact@v4
        with:
          name: config-${{ matrix.stage }}
          path: public
      - name: Build the web for ${{ matrix.stage }}
        env:
          VITE_APP_VERSION: ${{ needs.meta.outputs.version }}
          VITE_API_ENV: ${{ matrix.stage }}
        run: |
          npm run build
          (cd dist && zip -qr "$GITHUB_WORKSPACE/web-build-${{ matrix.stage }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.stage }}
          path: web-build-${{ matrix.stage }}.zip

  android:
    needs: [meta, config]
    if: ${{ needs.meta.outputs.build == 'true' }}
    strategy:
      matrix:
        stage: [staging, prod]
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      version_name: ${{ needs.meta.outputs.version }}
      stage: ${{ matrix.stage }}

  ios:
    needs: [meta, config]
    if: ${{ needs.meta.outputs.build == 'true' }}
    strategy:
      matrix:
        stage: [staging, prod]
    uses: ./.github/workflows/ios.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      version_name: ${{ needs.meta.outputs.version }}
      stage: ${{ matrix.stage }}

  # Puts the builds on this tag's release: new ones for a first rc, an earlier rc's otherwise.
  # A prod release carries only the prod builds.
  publish:
    needs: [meta, web, android, ios]
    if: ${{ !cancelled() && needs.meta.result == 'success' && (needs.meta.outputs.build != 'true' || (needs.web.result == 'success' && needs.android.result == 'success' && needs.ios.result == 'success')) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STAGE: ${{ needs.meta.outputs.stage }}
      VERSION: ${{ needs.meta.outputs.version }}
      FROM: ${{ needs.meta.outputs.from }}
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ needs.meta.outputs.build == 'true' }}
        with:
          path: builds

      - name: Collect the builds
        run: |
          set -euo pipefail
          mkdir upload
          if [ -n "$FROM" ]; then
            gh release download "$FROM" -D upload -p 'web-build-*' -p 'android-*' -p 'ios-*'
          else
            for s in staging prod; do
              cp "builds/web-$s/web-build-$s.zip" upload/
              find "builds/android-release-$VERSION-$s" -name '*.aab' -exec cp {} "upload/android-$s-app-release.aab" \;
              find "builds/android-release-$VERSION-$s" -name '*.apk' -exec cp {} "upload/android-$s-app-release.apk" \;
              cp "builds/ios-simulator-app-$VERSION-$s/App-simulator.zip" "upload/ios-$s-App-simulator.zip"
            done
          fi
          [ "$STAGE" = prod ] && find upload -type f ! -name '*prod*' -delete
          [ -f "upload/web-build-$STAGE.zip" ] || { echo "::error::No web-build-$STAGE.zip in ${FROM:-this build}. An rc made before per-stage builds cannot be reused: release a new rc."; exit 1; }
          ls -la upload

      - name: GitHub release (reuse the one made in the UI, if any)
        run: |
          FLAG=$([ "$STAGE" = staging ] && echo --prerelease || echo --latest)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" $FLAG
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes $FLAG
          fi
          gh release upload "$GITHUB_REF_NAME" upload/* --clobber

      - name: Test channels
        if: ${{ needs.meta.outputs.stage == 'staging' }}
        run: |
          {
            echo "### App $VERSION on the test channels"
            [ -n "$FROM" ] && echo "Same builds as **$FROM** (this commit was built for that rc)."
            echo "| App | Android | iOS |"
            echo "| --- | --- | --- |"
            echo "| staging \`com.tanatorn.ioniccipoc.staging\` (testers, staging API) | \`android-staging-app-release.apk\` sent to **Firebase App Distribution** (real, see the android (staging) job) | \`ios-staging-App-simulator.zip\` (simulated) |"
            echo "| prod \`com.tanatorn.ioniccipoc\` (the build the stores get) | \`android-prod-app-release.aab\` to Play **internal** (simulated) | \`ios-prod-App-simulator.zip\` to **TestFlight** (simulated) |"
            echo
            echo "A signed IPA needs an Apple account; the iOS files are Simulator builds."
          } >> "$GITHUB_STEP_SUMMARY"

  # Simulated: the prod tag promotes the rc's prod app builds to the stores. A person approves first.
  mobile-store:
    needs: [meta, publish]
    if: ${{ needs.meta.outputs.stage == 'prod' }}
    runs-on: ubuntu-latest
    environment: app-store
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      STG: ${{ needs.meta.outputs.from }}
    steps:
      - name: Store credentials (from the app-store environment)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON is missing in the app-store environment."; exit 1; }
          [ -n "$APP_STORE_CONNECT_API_KEY" ] || { echo "::error::APP_STORE_CONNECT_API_KEY is missing in the app-store environment."; exit 1; }
          echo "Play project: $(jq -r '.project_id // "not set"' <<<"$PLAY_SERVICE_ACCOUNT_JSON" 2>/dev/null || echo 'not JSON')"
          echo "App Store Connect key: present"
      - name: Simulated store release
        run: |
          {
            echo "### App $VERSION released to the stores (simulated)"
            echo "The prod builds of **$STG**, no rebuild."
            echo "| Platform | Would run |"
            echo "| --- | --- |"
            echo "| Android | promote \`android-prod-app-release.aab\` of $STG from internal to **production** (staged rollout 10%) |"
            echo "| iOS | submit the prod build of $STG from TestFlight for **App Store review**, release by hand after approval |"
          } >> "$GITHUB_STEP_SUMMARY"
